name: Build and release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.18.2', '1.19.2', '1.20.1']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Build distributable and run core tests
        run: ./gradlew -Pmc=${{ matrix.minecraft }} release --console=plain
      - name: Run dedicated server integration tests
        run: ./gradlew -Pmc=${{ matrix.minecraft }} -PgameTests=true :forge-${{ matrix.minecraft }}:runGameTestServer --console=plain
      - name: Verify Sophisticated liquid XP fractional drains
        run: ./gradlew -Pmc=${{ matrix.minecraft }} -PgameTests=true -Pcompat=sophisticated :forge-${{ matrix.minecraft }}:runGameTestServer --console=plain
      - name: Verify CEI priority when both fluid IDs exist
        run: ./gradlew -Pmc=${{ matrix.minecraft }} -PgameTests=true -Pcompat=both :forge-${{ matrix.minecraft }}:runGameTestServer --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: trashbin-forge-${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: trashbin-forge-*
          merge-multiple: true
          path: dist
      - name: Check all three jars and generate SHA-256 checksums
        run: python3 scripts/verify_jars.py
      - name: Test release retries and failure handling without publishing
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: trashbin-release
          path: |
            dist/*.jar
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: trashbin-release
          path: dist
      - name: Publish tag release with jars and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish_release.sh
