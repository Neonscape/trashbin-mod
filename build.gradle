plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

allprojects {
    group = 'io.github.whiteviera.trashbin'
    version = rootProject.mod_version
    repositories { mavenCentral() }
}

subprojects {
    if (name.startsWith('forge-')) {
        apply from: rootProject.file('gradle/forge.gradle')
    } else if (name.startsWith('neoforge-')) {
        apply from: rootProject.file('gradle/neoforge.gradle')
    }
}

tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
tasks.register('release', Copy) {
    dependsOn tasks.named('build')
    // Copy only each project's current jar, never stale jars from an earlier version.
    from(subprojects.findAll { it.name != 'core' }.collect { it.tasks.named('jar') })
    into layout.projectDirectory.dir('dist')
}
